name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup build cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --all-features

      - name: Clippy
        run: cargo clippy --all-features --all-targets

      - name: Rustfmt
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --all-features

      - name: Pull Portainer test images
        run: docker pull portainer/portainer-ce:2.45.3 && docker pull busybox

      - name: Run Portainer tests
        run: cargo test --all-features --test portainer -- --ignored
