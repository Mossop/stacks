[package]
name = "stacks"
description = "A simple command for running inter-dependent docker compose projects"
version = "0.4.1"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap-verbosity-flag = "3.0.4"
flexi_logger = { version = "0.31.10", features = ["colors"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
serde_yaml = "0.9.34"
