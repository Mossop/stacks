[package]
name = "stacks"
description = "A simple command for running inter-dependent docker compose projects"
version = "0.5.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
serde_yaml_ng = "0.10.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "smallvec", "std"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart"] }
testcontainers = { version = "0.28.0", features = ["blocking", "http_wait"] }
